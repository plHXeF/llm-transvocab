name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            artifact: windows-x64
            asset: llm-transvocab-windows-x64
            format: windows
          - label: macOS Apple Silicon
            runner: macos-15
            artifact: macos-arm64
            asset: llm-transvocab-macos-arm64
            format: macos
          - label: macOS Intel
            runner: macos-15-intel
            artifact: macos-x64
            asset: llm-transvocab-macos-x64
            format: macos

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Verify source
        shell: bash
        run: |
          python -m py_compile *.py tests/*.py
          python -m unittest discover -s tests -v
          python -m pip check

      - name: Build desktop application
        run: pyinstaller packaging/llm-transvocab.spec --noconfirm --clean

      - name: Package Windows build
        if: matrix.format == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath "dist/LLM TransVocab" -DestinationPath "${{ matrix.asset }}.zip"
          $hash = (Get-FileHash "${{ matrix.asset }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset }}.zip" | Set-Content "${{ matrix.asset }}.sha256" -Encoding ascii

      - name: Package macOS build
        if: matrix.format == 'macos'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/LLM TransVocab.app" "${{ matrix.asset }}.zip"
          shasum -a 256 "${{ matrix.asset }}.zip" > "${{ matrix.asset }}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.artifact }}
          path: |
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged applications
        uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "LLM TransVocab ${GITHUB_REF_NAME}"
